[package]
name = "ymacs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A fast, GPU-rendered editor with Emacs keys"
repository = "https://github.com/rchindris/ymacs"
readme = "README.md"

[dependencies]
alacritty_terminal = "0.26.0"
futures = "0.3"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# Held below 0.2.190, which removed ENOATTR on Linux: xattr 0.2 (pulled in by
# GPUI's HTTP client) still uses it, so newer versions don't build there.
libc = "=0.2.189"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
regex = "1.13"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
steel-core = "0.8.3"
streaming-iterator = "0.1"
tree-sitter = "0.26"
tree-sitter-bash = "0.25.1"
tree-sitter-elisp = "1.7.2"
tree-sitter-json = "0.24"
tree-sitter-language = "0.1.7"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24"
tree-sitter-scheme = "0.25.0"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"

# Optimise dependencies (GPUI, ropey) even in debug builds so `cargo run` stays snappy;
# our own crate keeps fast incremental compiles and full debug info.
[profile.dev.package."*"]
opt-level = 3

# `cargo deb` (used by the release workflow) builds the Debian package from this.
[package.metadata.deb]
maintainer = "Radu Chindris <radu.chindris@uzina-software.com>"
section = "editors"
extended-description = """\
ymacs keeps Emacs' editing model and key bindings, rendered on the GPU with GPUI
and backed by a rope. It is not an Emacs Lisp clone."""
depends = "$auto"
assets = [
  ["target/release/ymacs", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/ymacs/", "644"],
  ["LICENSE", "usr/share/doc/ymacs/copyright", "644"],
]
